name: Sync Upstream

on:
  workflow_dispatch:

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Rebase main onto upstream master
        run: |
          git remote add upstream https://github.com/ChaoningZhang/MobileSAM.git || true
          git fetch upstream master
          git checkout main
          before=$(git rev-parse HEAD)
          if ! git rebase upstream/master; then
            git rebase --abort
            echo "The mirror has diverged from upstream/master and requires manual conflict resolution."
            exit 1
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "No upstream changes to apply."
            exit 0
          fi
          git push origin HEAD:main
